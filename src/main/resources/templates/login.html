<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STRIDE — Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            STRIDE<span>.</span>
        </div>

        <div class="auth-header">
            <div class="crumb">начало / вход</div>

            <h1>Добре дошла обратно.</h1>

            <p>Продължи да следиш своя прогрес.</p>
        </div>

        <div class="card">

            <div class="card-head">
                <h2>Вход</h2>
            </div>

            <div class="card-pad">

                <div th:if="${param.error}" class="error">
                    Невалиден email или парола.
                </div>

                <div th:if="${param.logout}" class="success">
                    Успешно излезе от акаунта.
                </div>

                <form th:action="@{/login}" method="post">

                    <div class="field">
                        <label for="username">Email</label>

                        <input
                                type="email"
                                id="username"
                                name="username"
                                placeholder="you@example.com"
                                required>
                    </div>

                    <div class="field">
                        <label for="password">Парола</label>

                        <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required>
                    </div>

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit" class="btn-primary auth-submit">
                        Влез
                    </button>

                </form>

            </div>

        </div>

        <div class="auth-footer">
            Нямаш акаунт?
            <a th:href="@{/register}">Регистрирай се</a>
        </div>

    </div>

</div>

</body>
</html>

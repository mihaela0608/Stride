<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRIDE — Впиши бягане</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">STRIDE<span>.</span></div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="index.html"><span class="icon">⌂</span> Dashboard</a></li>
        <li><a href="goals.html"><span class="icon">◎</span> Цели</a></li>
        <li><a href="training-plan.html"><span class="icon">▤</span> Тренировъчен план</a></li>
        <li><a href="runs.html" class="active"><span class="icon">↻</span> Бягания</a></li>
        <li><a href="progress.html"><span class="icon">▲</span> Прогрес</a></li>
        <li><a href="profile.html"><span class="icon">●</span> Профил</a></li>
      </ul>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar">М</div>
        <div><div class="name">Михаела</div><div class="role">intermediate runner</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="crumb"><a href="runs.html" class="faint">бягания</a> / ново</div>
        <h1>Впиши бягане</h1>
      </div>
    </div>

    <div class="content" style="max-width:760px">
      <form>
        <div class="card card-pad">
          <div class="form-grid">
            <div class="field">
              <label>Дата</label>
              <input type="date" value="2026-08-31">
            </div>
            <div class="field">
              <label>Тип бягане</label>
              <select>
                <option>Лесно бягане</option>
                <option>Дълго бягане</option>
                <option>Темпо бягане</option>
                <option>Интервали</option>
                <option>Възстановително</option>
                <option>Състезание</option>
              </select>
            </div>
            <div class="field">
              <label>Дистанция</label>
              <div class="input-suffix"><input type="text" placeholder="5.0"><span>км</span></div>
            </div>
            <div class="field">
              <label>Времетраене</label>
              <input type="text" placeholder="28:40">
            </div>
            <div class="field">
              <label>Среден пулс <span class="faint">(незадължително)</span></label>
              <div class="input-suffix"><input type="text" placeholder="152"><span>уд/мин</span></div>
            </div>
            <div class="field">
              <label>Денивелация <span class="faint">(незадължително)</span></label>
              <div class="input-suffix"><input type="text" placeholder="45"><span>м</span></div>
            </div>
            <div class="field full">
              <label>Усещане за усилие (RPE)</label>
              <select>
                <option>1 — много леко</option><option>2</option><option>3</option>
                <option selected>4 — леко</option><option>5</option><option>6</option>
                <option>7 — трудно</option><option>8</option><option>9</option><option>10 — максимално</option>
              </select>
            </div>
            <div class="field full">
              <label>Бележки <span class="faint">(незадължително)</span></label>
              <textarea rows="3" placeholder="Как се почувства бягането..."></textarea>
            </div>
          </div>
        </div>

        <div style="display:flex; gap:14px; margin-top:32px;">
          <button type="submit" class="btn-primary">Запази бягането</button>
          <a href="runs.html" class="btn-secondary">Отказ</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
